var map = L.map('map',{tap:true}).setView([50.030, 14.505], 13);

// plnobarevny OSM podklad (bez API klice)
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  maxZoom:19, attribution:'&copy; přispěvatelé OpenStreetMap'
}).addTo(map);

var BASE_FILL = 0.42;

function barvaHex(v){
  return v>80 ? '#b85c00' :
         v>60 ? '#d27400' :
         v>45 ? '#e08a00' :
         v>30 ? '#f4c20d' :
                '#ffe94d';
}
function styl(f){
  return {fillColor:barvaHex(f.properties.pref_kdu_celkem),
          weight:1.5, opacity:1, color:'#444', fillOpacity:BASE_FILL};
}
function fmt(x){return (x==null||x==='')?'—':x;}

var selected=null;
function deselect(){ if(selected){ gj.resetStyle(selected); selected=null; } }

function onEach(f,layer){
  var p=f.properties;
  var ulice = p.ulice ? '<div class="pp-sec"><b>Ulice:</b> '+p.ulice+'</div>' : '';
  var mist  = p.mistnost ? '<div class="pp-sec"><b>Volební místnost:</b> '+p.mistnost+'</div>' : '';
  var html='<div class="pp-ok">Okrsek '+p.okrsek+'</div>'
    +'<div class="pp-row"><span>Voliči</span><span>'+fmt(p.vol_seznam)+'</span></div>'
    +'<div class="pp-row"><span>Domů (RÚIAN)</span><span>'+fmt(p.domu_ruian)+'</span></div>'
    +'<div class="pp-row"><span>KDU pref. hlasy</span><span>'+fmt(p.pref_kdu_celkem)+'</span></div>'
    +'<div class="pp-row"><span>% SPOLU</span><span>'+fmt(p.spolu_pct)+' %</span></div>'
    +ulice+mist;

  layer.bindPopup(html,{maxWidth:280, offset:[0,-12], autoPanPaddingTopLeft:[20,140], autoPanPaddingBottomRight:[20,30]});

  layer.on('mouseover',function(){ if(this!==selected) this.setStyle({weight:3,color:'#000'}); });
  layer.on('mouseout', function(){ if(this!==selected) gj.resetStyle(this); });

  layer.on('click',function(e){
    deselect();
    selected=this;
    this.setStyle({fillOpacity:0.05, weight:3, color:'#000'});
    this.bringToFront();
    // popup otevri u HORNIHO okraje okrsku, ne ve stredu -> nezakryva ho
    var b=this.getBounds();
    var top=L.latLng(b.getNorth(), b.getCenter().lng);
    this.getPopup().setLatLng(top);
  });
}

var gj=L.geoJSON(data,{style:styl,onEachFeature:onEach}).addTo(map);
map.fitBounds(gj.getBounds(),{padding:[10,10]});
map.on('popupclose', deselect);

var leg=L.control({position:'bottomright'});
leg.onAdd=function(){
  var d=L.DomUtil.create('div','legend');
  d.innerHTML='<b>KDU pref. hlasy (PS 2025)</b>'
    +'<div><i style="background:#ffe94d"></i> do 30</div>'
    +'<div><i style="background:#f4c20d"></i> 31–45</div>'
    +'<div><i style="background:#e08a00"></i> 46–60</div>'
    +'<div><i style="background:#d27400"></i> 61–80</div>'
    +'<div><i style="background:#b85c00"></i> nad 80</div>';
  return d;
};
leg.addTo(map);
</script>
